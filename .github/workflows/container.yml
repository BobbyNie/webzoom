name: Test and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  quality:
    name: Go, browser and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check workflow release policy
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-venv"
          "$RUNNER_TEMP/workflow-venv/bin/pip" install -r .github/tests/requirements.txt
          "$RUNNER_TEMP/workflow-venv/bin/python" -m unittest discover -s .github/tests -v
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Go tests and static checks
        run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Frontend tests and production build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Chromium screen-sharing tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  image:
    name: Build and test non-root image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the candidate image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: webzoom:local
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify default UID, arbitrary UID and HTTPS proxy
        run: go test -count=1 -tags deploymenttests -v ./internal/deploy
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Export the tested image
        run: |
          mkdir -p artifacts/image
          docker image inspect webzoom:local --format '{{.Id}}' > artifacts/image/image-id.txt
          docker save webzoom:local | gzip > artifacts/image/webzoom.tar.gz
      - name: Keep the tested image for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-container
          path: artifacts/image/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish Docker Hub image and GitHub Release
    needs: [quality, image]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: webzoom-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_NAME: bobbynie/webzoom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$DOCKERHUB_USERNAME" != 'bobbynie' || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure DOCKERHUB_USERNAME=bobbynie and a write-enabled DOCKERHUB_TOKEN in repository Actions secrets.'
            exit 1
          fi
      - name: Retrieve this run's tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-container
          path: artifacts/image
      - name: Load and verify image identity
        run: |
          gunzip -c artifacts/image/webzoom.tar.gz | docker load
          test "$(docker image inspect webzoom:local --format '{{.Id}}')" = "$(cat artifacts/image/image-id.txt)"
          test "$(docker image inspect webzoom:local --format '{{.Config.User}}')" = '65532:65532'
      - name: Plan stable version and matching image tags
        id: version
        run: python3 .github/scripts/release.py plan
      - name: Authenticate to Docker Hub
        if: steps.version.outputs.published != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the same image that passed the tests
        if: steps.version.outputs.published != 'true'
        env:
          IMAGE_TAGS: ${{ steps.version.outputs.tags }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag webzoom:local "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          docker image inspect "$IMAGE_NAME:$RELEASE_VERSION" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep '^bobbynie/webzoom@sha256:' > artifacts/image/image-digest.txt
      - name: Create or verify the Git version tag
        if: steps.version.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/release.py tag
      - name: Publish GitHub Release with image digest
        if: steps.version.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_LATEST: ${{ steps.version.outputs.latest }}
        run: python3 .github/scripts/release.py publish
