name: Test and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    name: Go, browser and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check workflow release policy
        run: |
          python3 -m venv "$RUNNER_TEMP/workflow-venv"
          "$RUNNER_TEMP/workflow-venv/bin/pip" install -r .github/tests/requirements.txt
          "$RUNNER_TEMP/workflow-venv/bin/python" -m unittest discover -s .github/tests -v
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Go tests and static checks
        run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Frontend tests and production build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Chromium screen-sharing tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  image:
    name: Build and test non-root image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the candidate image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: webzoom:local
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify default UID, arbitrary UID and HTTPS proxy
        run: go test -count=1 -tags deploymenttests -v ./internal/deploy
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Export the tested image
        run: |
          mkdir -p artifacts/image
          docker image inspect webzoom:local --format '{{.Id}}' > artifacts/image/image-id.txt
          docker save webzoom:local | gzip > artifacts/image/webzoom.tar.gz
      - name: Keep the tested image for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-container
          path: artifacts/image/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish verified image to GHCR
    needs: [quality, image]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Retrieve this run's tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-container
          path: artifacts/image
      - name: Load and verify image identity
        run: |
          gunzip -c artifacts/image/webzoom.tar.gz | docker load
          test "$(docker image inspect webzoom:local --format '{{.Id}}')" = "$(cat artifacts/image/image-id.txt)"
          test "$(docker image inspect webzoom:local --format '{{.Config.User}}')" = '65532:65532'
      - name: Set lower-case registry name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Prepare immutable and release tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the same image that passed the tests
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag webzoom:local "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          {
            echo '## Published non-root image'
            printf 'Image: `%s`\n\n' "$IMAGE_NAME"
            printf 'Default UID/GID: `65532:65532`. Platform: `linux/amd64`.\n\n'
            printf 'Tested with an arbitrary non-root UID and a read-only root filesystem.\n\n'
            echo '```text'
            docker image inspect webzoom:local --format '{{join .RepoDigests "\n"}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
