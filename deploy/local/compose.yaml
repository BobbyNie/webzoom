name: webzoom-local
services:
  app:
    build: ../..
    image: webzoom:local-demo
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TOTAL_BANDWIDTH_LIMIT_MBPS: ${TOTAL_BANDWIDTH_LIMIT_MBPS:-200}
      BANDWIDTH_CONFIG_FILE: /data/bandwidth.json
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      LOAD_TEST_MAX_ROOMS: ${LOAD_TEST_MAX_ROOMS:-0}
      LOAD_TEST_MAX_VIEWERS: ${LOAD_TEST_MAX_VIEWERS:-0}
      PUBLIC_URL: https://webzoom.localhost:8443
      OIDC_ISSUER: https://webzoom.localhost:8443/idp/realms/webzoom-local
      OIDC_CLIENT_ID: webzoom
      OIDC_CLIENT_SECRET: local-demo-client-secret-not-for-production
      SSL_CERT_FILE: /trust/fullchain.pem
    volumes:
      - app-data:/data
      - ../../.secrets/local/fullchain.pem:/trust/fullchain.pem:ro
    networks: [demo]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: [start-dev, --import-realm]
    user: "1000:0"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KC_DB: dev-mem
      KC_HOSTNAME: https://webzoom.localhost:8443/idp
      KC_HTTP_RELATIVE_PATH: /idp
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    networks: [demo]
  proxy:
    build:
      context: ../..
      dockerfile: Dockerfile.proxy
    image: webzoom-proxy:local
    entrypoint: [nginx, -g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=101,gid=101,mode=1770"]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../.secrets/local:/etc/webzoom/tls:ro
    depends_on: [app, keycloak]
    networks:
      demo:
        aliases: [webzoom.localhost]
networks:
  demo: {}

volumes:
  app-data: {}
