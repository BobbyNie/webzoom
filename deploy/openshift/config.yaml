apiVersion: v1
kind: ConfigMap
metadata:
  name: webzoom-config
data:
  TOTAL_BANDWIDTH_LIMIT_MBPS: "200" # Bootstrap only; saved administrator configuration takes precedence.
  BANDWIDTH_CONFIG_FILE: /data/bandwidth.json
  ADMIN_USER_IDS: "" # Comma-separated OIDC sub values; empty disables admin access.
  PUBLIC_URL: https://webzoom.apps.example.intranet
  OIDC_ISSUER: https://keycloak.example.intranet/realms/company
  OIDC_CLIENT_ID: webzoom
  LISTEN_ADDR: :8080
  STATIC_DIR: /app/web
  SSL_CERT_FILE: /etc/webzoom/trust/ca-bundle.crt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webzoom-trusted-ca
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
