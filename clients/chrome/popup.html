<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>WebZoom 局域网分流</title>
<style>body{font:14px system-ui;width:340px;margin:0;padding:22px;line-height:1.65;color:#203d35;background:#f5f8f6}h1{font-size:20px;margin:0 0 8px}.site{overflow-wrap:anywhere;color:#53675f;font-size:12px}button{font:inherit;background:#17664c;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.6}#result{background:white;border:1px solid #d4ded8;border-radius:8px;padding:12px;white-space:pre-line}.note{font-size:12px;color:#586b63}ol{padding-left:20px}</style></head>
<body><h1>WebZoom 局域网分流</h1><div class="site" id="site"></div>
<ol><li>运行配套的 EXE 安装程序。</li><li>点击下方按钮检查本机。</li><li>在会议中勾选「使用局域网 UDP 分流」。</li></ol>
<button id="check" type="button">检查安装和网络</button>
<p id="result" role="status" aria-live="polite">检查只在本机进行，不发送广播、不修改防火墙。</p>
<p class="note">每台电脑同时仅支持一场 LAN 会议。检查端口前请先退出其他 LAN 会议。会议失败时不会自动切换为全员单独下载。</p>
<script type="module" src="popup.js"></script></body></html>
