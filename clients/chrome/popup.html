<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>WebZoom LAN</title><style>body{font:14px system-ui;width:300px;padding:18px;line-height:1.6;color:#25483d}h1{font-size:18px}</style><h1>WebZoom 局域网分流</h1><p>在获批 WebZoom 会议页面勾选「使用局域网 UDP 分流」。页面会显示探测、中继或接收状态。</p><p>需要配套安装本地辅助程序，并由 IT 批准网卡、UDP 端口及防火墙策略。本扩展不会申请管理员权限，也不会修改防火墙。</p><p>每台电脑同时仅支持一场 LAN 会议。</p></html>
